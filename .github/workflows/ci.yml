name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SILSIGAN_REQUIRE_SQLITE_TESTS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install and verify SQLite
        run: |
          sudo apt-get update
          sudo apt-get install --yes sqlite3
          sqlite3 --version

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/mobile install --frozen-lockfile
          pnpm --dir apps/webview install --frozen-lockfile

      - name: Audit locked dependencies
        run: pnpm audit:security

      - name: Run deterministic verification gate
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          pnpm verify 2>&1 | tee .ci-artifacts/verify.log

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-failure-${{ github.run_id }}
          path: .ci-artifacts/verify.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint and build Android debug shell
        working-directory: apps/webview/android
        run: ./gradlew :app:lintDebug :app:assembleDebug --no-daemon
