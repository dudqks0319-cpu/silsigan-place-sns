local_checks:
  - name: "Local map/tourism runtime recovery"
    command: "pnpm typecheck && pnpm lint && pnpm test"
    status: "pass"
    evidence: "2026-06-29 local delta adds same-origin /api/tourism/attractions fallback route, same-origin read fallback when .env.local points at an offline local Worker URL, and Naver marker offset fixes; pnpm typecheck, pnpm lint, and pnpm test passed with 130 tests"
  - name: "In-app browser map marker detail QA"
    command: "manual browser QA at http://localhost:3000/"
    status: "pass"
    evidence: "2026-06-29 in-app browser confirmed home feed loads without Failed to fetch, map tab renders 13 Naver markers and tourism panel, 광안리해수욕장 marker hit target is top element, marker opens 광안리해수욕장 상세 정보, and 좋아요 local preview works; screenshot /private/tmp/silsigan-map-marker-detail-qa-20260629.png"
  - name: "Map and search empty-state recovery QA"
    command: "Chrome DevTools browser QA at http://127.0.0.1:3000/"
    status: "pass"
    evidence: "2026-06-29 browser QA confirmed impossible map search 없는장소zz shows 지도 데이터를 불러오지 못했어요 plus 재시도/검색으로 이동/사진 올리기 CTAs; clicking 검색으로 이동 opens search, the same impossible query shows a no-result message and 7 recommendation buttons: 광안리, 해운대, 황리단길, #주차만차, #웨이팅, #사진스팟, 지도에서 보기; screenshot /private/tmp/silsigan-map-search-empty-qa-20260629.png"
  - name: "Upload completion local feed reflection QA"
    command: "browser QA at http://127.0.0.1:3000/"
    status: "pass_local"
    evidence: "2026-06-30 local upload/report browser QA confirms completion feedback says the uploaded photo was reflected in the 광안리해수욕장 place feed, and submitted caption 브라우저 QA 업로드 1782745925336 is visible in the place feed within the same browser session; screenshot /private/tmp/silsigan-upload-complete-qa-20260630.png. This is local same-origin proof only and does not replace R2/staging mutation smoke"
  - name: "Photo-feed-first local Pages map smoke"
    command: "pnpm smoke:pages -- --pages-url=http://127.0.0.1:3000 --timeout-ms=60000"
    status: "pass_local"
    evidence: "2026-06-30 smoke waits for 방금 올라온 장소 사진, clicks bottom nav 지도, verifies the nationwide Naver/fallback map aria label, bottom nav aria-pressed state, map.visible, map.controlsUncovered, traffic/filter/requery/header controls, onboarding dismiss, My safety menu, ranking detail, and 광안리해수욕장 marker detail; artifacts artifacts/cloudflare-pages-smoke/pages-smoke-1782802662030.png, artifacts/cloudflare-pages-smoke/pages-smoke-network-1782802662032.json, artifacts/cloudflare-pages-smoke/pages-smoke-console-1782802662033.log"
  - name: "My tab UGC management smoke"
    command: "pnpm smoke:pages -- --pages-url=http://127.0.0.1:3000 --timeout-ms=60000"
    status: "pass_local"
    evidence: "2026-06-30 My tab exposes 신고/차단 관리 and 내 신고 내역, creates a local 광안리해수욕장 place report, verifies my.localReportActivityCreate and my.localReportActivityVisible with 장소 신고 plus 로컬 기록, then keeps My safety menu, map, ranking detail, and marker detail checks passing; artifacts artifacts/cloudflare-pages-smoke/pages-smoke-1782817053447.png, artifacts/cloudflare-pages-smoke/pages-smoke-network-1782817053448.json, artifacts/cloudflare-pages-smoke/pages-smoke-console-1782817053449.log; redaction scan found no token/key/coordinate/anonymous id/original filename strings in the new console/network artifacts"
  - name: "Content safety local Pages smoke"
    command: "pnpm smoke:pages -- --pages-url=http://127.0.0.1:3000 --timeout-ms=60000"
    status: "pass_local"
    evidence: "2026-06-30 content safety guard blocks phone-number-like comments and link-like report text before submission, verifies contentSafety.commentPrivacy and contentSafety.reportSpam in the browser, and keeps map/ranking/detail/My report-history checks passing; artifacts artifacts/cloudflare-pages-smoke/pages-smoke-1782817861517.png, artifacts/cloudflare-pages-smoke/pages-smoke-network-1782817861518.json, artifacts/cloudflare-pages-smoke/pages-smoke-console-1782817861518.log; redaction scan found no token/key/coordinate/anonymous id/original filename/blocked sample input strings in the new console/network artifacts"
  - name: "Local tourism/place API route check"
    command: "curl http://127.0.0.1:3000/api/tourism/attractions?regionId=busan&limit=5 && curl http://127.0.0.1:3000/api/places?regionId=busan"
    status: "pass_local"
    evidence: "2026-06-30 tourism route returned HTTP 200 with data.length=3, meta.provider=tourapi-fallback, reason=TOUR_API_SERVICE_KEY_REQUIRED; places route returned HTTP 200 with data.length=6. This proves local fallback behavior only, not live TourAPI or staging API readiness"
  - name: "Targeted Cloudflare API tests"
    command: "pnpm test"
    status: "pass"
    evidence: "133 tests passed on 2026-06-30 after content safety guard coverage, including phone/email/vehicle/link/script blocking, first-launch Busan/Gyeongju/Ulsan seed coverage, D1 ranking abuse smoke, UGC moderation runbook guard coverage, Cloudflare cost/usage runbook guard coverage, TestFlight review notes guard coverage, real-device QA ledger guard coverage, public privacy/support page guard coverage, privacy/support URL guard coverage, mobile TestFlight shell guard coverage, auth-aware external-state blocker canonicalization, and Worker deployment absence classification"
  - name: "Release status open blocker guard"
    command: "node scripts/release-state-check.mjs --strict"
    status: "blocked_expected"
    evidence: "release_harness.ledger.open_blockers fails with remaining open P0 release blockers; release_harness.status.open_blocker_evidence, ugc_moderation.runbook.required_tokens, mobile_testflight.app/app_config/experience gates, and ledger.next_actions.duplicate_lines pass and would fail status/ledger/runbook/mobile drift; 2026-06-28 .env.example defines staging/production API URL values, so URL shape preflight can pass while cf:external-state still surfaces R2_NOT_ENABLED and remaining API worker_deployment blockers"
  - name: "UGC moderation runbook gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/ugc-moderation-runbook.md includes ownership, MODERATION_ALERT_WEBHOOK_URL intake, 12h/24h/72h SLA, comment/photo targets, hide/restore/delete/restrict actions, evidence/audit, escalation, and stop conditions"
  - name: "Cloudflare cost and usage runbook gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/cloudflare-cost-usage-runbook.md includes Usage & billing dashboard checks, Billing alerts, daily/weekly evidence cadence, R2/D1/Workers/Durable Objects/Cloudflare Images metrics, budget thresholds, and TestFlight stop conditions"
  - name: "TestFlight review notes gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/testflight-review-notes.md includes beta description, reviewer instructions, staging URL requirements, permission copy, UGC moderation, privacy policy URL/support URL status, staging evidence, and stop conditions"
  - name: "Privacy and support URL gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "blocked_expected"
    evidence: "release:status now requires SILSIGAN_PRIVACY_POLICY_URL and SILSIGAN_SUPPORT_URL to be distinct HTTPS URLs before external TestFlight review notes can be submitted"
  - name: "Real-device QA ledger gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/real-device-qa.md now guards required iPhone/Android QA matrices, staging environment fields, permission flows, UGC flows, redaction requirements, crash checks, and artifact naming before TestFlight internal testing"
  - name: "Public privacy/support page gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "/privacy and /support page source now guards implemented data handling, TestFlight support, content reports, deletion requests, and final URL language before live privacy/support env URLs can be accepted"
  - name: "Mobile TestFlight public URL shell"
    command: "cd apps/mobile && pnpm lint && pnpm typecheck && pnpm test"
    status: "pass_local"
    evidence: "apps/mobile exposes privacy, support, and staging web link controls in the My tab, app.json extra.silsigan contains the same public URLs, release:status guards mobile UI/service-link/app-config URL and permission metadata, and 5 mobile tests pass including release-shaped public URL coverage"
  - name: "Release gate plan"
    command: "pnpm release:gate -- --plan-only"
    status: "pass"
    evidence: "docs/current-release-state.md; staging.api.smoke and pages.browser.smoke expose required staging URL envKeys"
  - name: "Release gate collect blockers"
    command: "pnpm release:gate -- --skip-verify --skip-dry-run --collect-blockers --tail-file=tests/fixtures/redacted-worker-tail.log --timeout-ms=120000"
    status: "blocked_expected"
    evidence: "2026-06-30 resultCounts pass=10 fail=6; tail redaction, critical audit, typegen, OpenNext build, frontend dry-runs, Cloudflare preflight, staging D1 evidence, and production D1 evidence pass; failures converge on open ledger blockers, R2_NOT_ENABLED, missing staging/production API Workers, staging API JSON_PARSE_FAILED, and staging Pages app.homeReady failure caused by the missing API Worker"
  - name: "Cloudflare external-state blocker refresh"
    command: "set -a; source .env.example; set +a; pnpm cf:external-state"
    status: "blocked_expected"
