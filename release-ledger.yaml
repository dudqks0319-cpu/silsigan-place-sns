runtime_checks:
  - name: "Local V2 mobile browser proof"
    target: "local"
    status: "pass"
    evidence: "2026-07-20 latest 390x844 local-report security smoke passed 58 required interactions with 683 redacted network events, no request-body storage, and no sensitive hits. It explicitly selected the report place, directly confirmed per-photo shooting/publishing rights before the file input became enabled, uploaded and published one photo report, reopened its approved place/report share link, scrolled and focused the exact report card, rendered the #지금 photo result, persisted its follow through the Worker preference API, returned from My, merged a cursor-based next page, submitted one exact-contract private place request, showed its owner-only needs-verification state in My, bootstrapped a server-bound anonymous session, required the exact deletion phrase, issued one permanent deletion request, proved remainingOwnedContentCount=0, rotated to the second session, and rejected the old proof with 403. The admin surface rendered aggregate, Tier A 75%, and Tier B 50% fresh-coverage KPIs, the five photo-cost meters, and the three global API-cost meters; it proved photo stop/resume plus global API stop, fresh Cloudflare reconciliation, and below-70% resume. Evidence is under artifacts/cloudflare-pages-smoke-worker-report-local with timestamp 1784508343166. The separate reviewed store candidates remain under artifacts/store-listing-candidate with timestamp 1784488590649. Computer Use also verified nationwide search/ranking, explicit sample labels, semantic tab Arrow-key navigation without global shortcut theft, origin scroll restoration, and removal of place/report query parameters on app back. This is local mock-data evidence, not staging-live, native real-device, or App Store submission evidence"
  - name: "Vercel protected preview"
    target: "vercel-preview"
    status: "pass_preview_backend_blocked"
    evidence: "2026-07-11 deployment dpl_82KfB9KGLrpysFVRjGnr36qDHnHN is Ready after framework correction to Next.js; authenticated home returns 200 and /api/places intentionally returns 503 LIVE_BACKEND_REQUIRED until Cloudflare API deployment"
  - name: "Staging Worker and Pages smoke"
    target: "cloudflare-staging"
    status: "web_live_readonly_pass_api_blocked"
    evidence: "2026-07-19 deployed staging web security version e87e79d5-5d30-43dc-adfe-1b5393a3b8d2 to https://silsigan-web-staging.dudqks0319.workers.dev. Live HTTP/2 200 verifies CSP, HSTS, Permissions-Policy, Referrer-Policy, nosniff, frame denial, cross-domain-policy denial, and no X-Powered-By header; public r2.dev and cloudflarestorage.com image host wildcards are removed. A fresh same-version non-mutating Chrome smoke passed load, onboarding, API-absent no-data map, uncovered controls, opaque bottom nav, traffic, filter, requery, safety, notification, home/my/map navigation, and recovery. Evidence is under artifacts/cloudflare-pages-smoke-staging-security-20260719 with timestamp 1784444654715; API-backed mutations remain unavailable"
  - name: "Capacitor real-device QA"
    target: "ios-android"
    status: "partial_simulator_pass_real_device_blocked"
    evidence: "The actual staging URL/origin is synchronized into both native shells. On 2026-07-20 WebView check and Android :app:lintDebug/:app:assembleDebug pass with Homebrew JDK 21, allowBackup=false, packaged backup/data-extraction exclusions, and app-scoped FileProvider paths; the debug APK SHA-256 remains 7439ae76464221f4dd26ae1ef7c4b5753b92ea52d49811b8d12244e53c4ae90f, but no Android emulator/device is attached. The last clean unsigned iOS Simulator Debug build/install/launch is the 2026-07-19 iPhone 17 evidence in artifacts/ios-simulator/staging-home.png. A 2026-07-20 rerun resolves the project and packages and validates Info.plist/PrivacyInfo.xcprivacy, but CoreSimulatorService repeatedly fails device-set allocation with Cannot allocate memory before asset compilation, including after a service-only restart. Release signing, final archive privacy report, store-console answers, push delivery, and real-device execution remain required"

