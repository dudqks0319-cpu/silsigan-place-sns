security:
  secrets:
    status: "pass_local"
    evidence: "No provider credential, token, stream URL, raw coordinate, or original filename is returned by public surfaces"
  authz:
    status: "pass_local"
    evidence: "Source policy, moderation, restriction, deletion, and identity link operations are deny-by-default and role, HMAC, or server-bound anonymous-proof gated; browser admin login/logout/moderation and Worker admin mutations enforce same-origin requests"
  validation:
    status: "pass_local"
    evidence: "Provider payloads, bridge commands, report observations, URLs, IDs, enums, and lengths are validated with negative tests"
  privacy:
    status: "pass_local"
    evidence: "Raw user coordinates and original photos are not stored; coarse buckets, re-encoded moderated variants, and SHA-256-only native push preference records are used. iOS packages a tracking-disabled PrivacyInfo manifest; Android denies app-data backup/device transfer and broad external-storage FileProvider access; the code-matched store disclosure remains a draft pending console and named review"
  abuse_controls:
    status: "pass_local"
    evidence: "A required 120 requests/minute hashed-IP Cloudflare limiter runs before D1, anonymous-session issuance has a separate 3/minute hashed-IP first-line edge limiter plus an exact D1-wide 5,000/day cap and 0 kill switch before session insert, recent valid sessions refresh last_seen_at at most once per 24 hours, streamed JSON stops at 64 KiB, upload tickets require server-validated Turnstile, photo reads use canonical cache plus a 1,000 cache-miss/IP/day HMAC ledger, 0022 prevents duplicate storage release across concurrent/retried delete paths, 0023 rejects stolen IDs without their separate proof, 0024 bounds distributed issuance, 0025 limits private place requests to 3/session/day and an exact 1,600/day global stop, and 0026 provides one-time 60% warning, 70% degradation, 80% critical reserve/stop, essential Worker snapshot, observed-usage reconciliation, and audited resume. KMA, TourAPI, national parking, ITS traffic/CCTV, and Seoul realtime also reserve bounded Korea Standard Time daily request budgets before network access, fail invalid configuration or timestamps to a 0/fail-closed path, share ITS accounting, and cap each run at two attempts. The web layer additionally fails over to a verified static place directory without API/NAVER/telemetry/write calls. Route limits, duplicate suppression, approval-only publication, moderation, circuit breakers, retention cleanup, and audit records are covered"
  dependency_audit:
    status: "pass"
    evidence: "2026-07-22 pnpm audit:security checked root and mobile lockfiles at low severity and reported no known vulnerabilities; the final tracked-source high-confidence secret-pattern scan reported zero matches, while .env.example keeps empty placeholders only"
  legal_operations:
    status: "blocked_expected"
    evidence: "docs/v2-legal-operations-gate.md requires named reviewers, dates, policy versions, and external evidence"

