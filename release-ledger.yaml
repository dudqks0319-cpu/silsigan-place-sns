schema_version: 1

project:
  name: "silsigan"
  slug: "silsigan"
  platforms:
    - "nextjs"
    - "cloudflare-workers"
    - "cloudflare-d1"
    - "cloudflare-r2"
    - "cloudflare-durable-objects"
    - "capacitor-ios-android"
  owner: "me"
  release_goal: "방문 가능 여부를 신뢰 가능한 현재 데이터로 판단하는 V2를 Cloudflare와 Capacitor 구조로 검증한다."

candidate:
  phase: "v2_local_ready_external_blocked"
  version: "0.1.0"
  build_number: "not_applicable"
  git_sha: "30360956cd4aad29b145dce664f8bc7943bd5874"
  branch: "codex/silsigan-progress-20260710"
  dirty_state: "source_committed_remote_matched_generated_evidence_preserved"
  source_of_truth: "docs/current-release-state.md"

local_checks:
  - name: "Lint"
    command: "pnpm lint"
    status: "pass"
    evidence: "2026-07-20 pass"
  - name: "Typecheck"
    command: "pnpm typecheck"
    status: "pass"
    evidence: "2026-07-20 pass"
  - name: "Full tests"
    command: "npm test"
    status: "pass"
    evidence: "2026-07-20 committed test set 422 passed, 0 failed, 0 skipped; API/R2/D1/realtime, schema-only migration boundary, public read availability, anonymous proof and issuance budget, private place-request guards, global 60/70/80 cost guard, Turnstile validation, role-before-reservation, forged-proof cost accounting, atomic resume safety, native HEIC-to-JPEG validation, privacy/backup contracts, release evidence, and store disclosure gates are covered"
  - name: "Source ingestion scheduler"
    command: "npm test"
    status: "ready_local_activation_blocked"
    evidence: "2026-07-20 local migrations 0018 through 0026 pass. Backup-gated recovery preserved the empty legacy source table under an archive name, then normal Wrangler migrations applied 0018 through 0026. The latest non-mutating remote evidence verifies no pending migrations, aligned registry, core seed evidence, zero unsafe active targets, and zero writes from the verification. A mode-0600 pre-change external backup with recorded SHA-256 remains preserved. Post-0022 uploads remain stopped until live R2/D1 reconciliation"
  - name: "Global Workers and D1 cost guard"
    command: "npm test"
    status: "pass_local_external_bindings_blocked"
    evidence: "0026 atomically reserves conservative route weights, accepts higher Cloudflare-observed values, emits one redacted 60% warning per day, degrades non-essential work at 70%, preserves the final reserve only for privacy/emergency controls to 80%, serves essential nationwide reads from a D1-write-free Worker snapshot, and requires a fresh below-70% reconciliation before resume. A second matching-static-asset layer keeps five verified place locations available after API Worker exhaustion while suppressing live state, photos, reports, scores, telemetry, retries, realtime, NAVER/external search, and writes; strict parser and Wrangler run_worker_first=false contract tests pass. The 2026-07-20 local Chrome 503 harness observed two initial API requests, one static-directory request, then zero post-fallback API, NAVER-provider, or analytics requests; it stored no request bodies. Artifacts are under artifacts/static-directory-failover with timestamp 1784507359630. Health checks pass both edge admission and the global ledger, forged anonymous proofs reserve authentication lookup cost before D1, admin routes verify the exact minimum role before protected-capacity reservation, and resume safety is rechecked inside the same D1 transaction. Separate staging/production COST_GUARD_STATE namespaces now exist and are bound independently from CACHE; live WAF/invocation-free static-routing evidence remains an external blocker"
  - name: "Public source fallback evidence"
    command: "pnpm evidence:public-sources"
    status: "pass_local"
    evidence: "2026-07-20 KMA, TourAPI, national parking, national traffic, national CCTV, and Seoul realtime fixtures pass network/fresh/stale-degraded/expired-insufficient transitions; the aggregate-only artifact reports passedSources=6, failedSources=0, sensitiveHits=[] under artifacts/public-source-fallback-local/public-source-fallback.json. Real rights, credentials, quotas, health, and staging ingestion remain external"
  - name: "Cloudflare Worker rollback drill"
    command: "pnpm cf:rollback:drill -- --env=staging --kind=web --check"
    status: "pass_readonly_candidate_actual_drill_pending"
    evidence: "2026-07-20 the non-mutating harness resolved the exact staging web Worker, read deployment history only, selected current e87e79d5-5d30-43dc-adfe-1b5393a3b8d2 and previous stable d7c2bab9-101f-4d2c-a8c3-0b02e9f6e14e, emitted no author/message/raw-error data, and recorded mutationsPerformed=false under artifacts/cloudflare-rollback-drill/staging-web-readonly.json. Actual rollback, smoke, and forward restoration remain explicit-approval gates; Worker rollback excludes D1/R2/KV/Durable Objects/migrations/secrets"
  - name: "R2 cost-guard Computer Use QA"
    command: "manual Chrome operator flow"
    status: "pass_local"
    evidence: "2026-07-19 local Chrome authenticated through the same-origin JSON route and rendered five storage/write/Images-transform/monthly-read/daily-read meters plus aggregate-only beta KPIs; a recorded reason stopped uploads and reads together, and re-enable stayed locked until a new reason plus D1 ledger acknowledgement before returning to protection-on. Evidence: artifacts/cloudflare-pages-smoke-worker-report-local/pages-smoke-admin-cost-guard-stopped-1784459655424.png and pages-smoke-admin-cost-guard-running-1784459655424.png"
  - name: "Production build"
    command: "pnpm build"
    status: "pass"
    evidence: "2026-07-20 Next.js 16.2.6 compiled without warnings and generated the application manifest including /api/admin/photo-cost-guard and /api/admin/beta-kpis"
  - name: "Cloudflare type generation"
    command: "pnpm cf:typegen"
    status: "pass_local"
    evidence: "2026-07-20 generated CloudflareEnv types from tracked .env.example keys, including SILSIGAN_ANON_SESSION_REQUIRED and SILSIGAN_ANON_SESSION_DAILY_LIMIT, with exit status 0"
  - name: "OpenNext Cloudflare build"
    command: "pnpm cf:build"
    status: "pass_local"
    evidence: "2026-07-20 generated .open-next/worker.js and 140 assets for Next.js 16.2.6; staging and production frontend/API Wrangler dry-runs passed without deploying or changing traffic"
  - name: "V2 decision and legal operations docs"
    command: "node scripts/release-state-check.mjs"
    status: "pass_local"
    evidence: "Decision register and legal operations gate are present, tokenized, and redaction checked"
  - name: "Native push token privacy seam"
    command: "pnpm --dir apps/webview check && npm test"
    status: "pass_local"
    evidence: "2026-07-14 bridge exposes iOS/Android platform metadata, frontend hashes native tokens before preference sync, and opt-out clears the stored hash; provider delivery and device evidence remain external"

runtime_checks:
  - name: "Local V2 mobile browser proof"
    target: "local"
    status: "pass"
    evidence: "2026-07-20 latest 390x844 local-report security smoke passed 58 required interactions with 614 redacted network events, no request-body storage, and no sensitive hits. It explicitly selected the report place, directly confirmed per-photo shooting/publishing rights before the file input became enabled, uploaded and published one photo report, reopened its approved place/report share link, scrolled and focused the exact report card, rendered the #지금 photo result, persisted its follow through the Worker preference API, returned from My, merged a cursor-based next page, explicitly selected one mocked NAVER result to prefill only name/address/category without a pre-submit place-request POST, then submitted one exact-contract private place request and showed its owner-only needs-verification state in My. It also bootstrapped a server-bound anonymous session, required the exact deletion phrase, issued one permanent deletion request, proved remainingOwnedContentCount=0, rotated to the second session, and rejected the old proof with 403. The admin surface rendered aggregate, Tier A 75%, and Tier B 50% fresh-coverage KPIs, the five photo-cost meters, and the three global API-cost meters; it proved photo stop/resume plus global API stop, fresh Cloudflare reconciliation, and below-70% resume. Evidence is under artifacts/cloudflare-pages-smoke-worker-report-local with timestamp 1784510945721. The refreshed reviewed store candidates are under artifacts/store-listing-candidate with timestamp 1784509404889; that run independently passed 58/58 required checks with 664 redacted events, no request-body storage, no sensitive hits, and no inactive cross-device member promise. Computer Use also verified nationwide search/ranking, explicit sample labels, semantic tab Arrow-key navigation without global shortcut theft, origin scroll restoration, and removal of place/report query parameters on app back. This is local mock-data evidence, not staging-live, native real-device, or App Store submission evidence"
  - name: "Vercel protected preview"
    target: "vercel-preview"
    status: "pass_preview_backend_blocked"
    evidence: "2026-07-11 deployment dpl_82KfB9KGLrpysFVRjGnr36qDHnHN is Ready after framework correction to Next.js; authenticated home returns 200 and /api/places intentionally returns 503 LIVE_BACKEND_REQUIRED until Cloudflare API deployment"
  - name: "Staging Worker and Pages smoke"
    target: "cloudflare-staging"
    status: "web_live_readonly_pass_api_blocked"
    evidence: "2026-07-20 deployed staging web version adefd801-6183-4126-8291-5311a37c6f94 to https://silsigan-web-staging.dudqks0319.workers.dev. HTML documents return Cache-Control public max-age=0 must-revalidate, preventing stale HTML from referencing removed deployment chunks, while Workers Static Assets retain ETag revalidation. A fresh 390x844 live read-only smoke passed at timestamp 1784511619488: nationwide static places remain discoverable, traffic integration stays visibly disabled, requery preserves protection mode, and rankings are truthfully suspended without current evidence. Evidence is under artifacts/cloudflare-pages-smoke-staging-cache-fixed-20260720; a staging API bootstrap/secret target now exists, but API-backed rankings, details, and mutations remain unavailable because the configured application has not been deployed"
  - name: "Capacitor real-device QA"
    target: "ios-android"
    status: "partial_simulator_pass_real_device_blocked"
    evidence: "The actual staging URL/origin is synchronized into both native shells. On 2026-07-20 WebView check and Android :app:lintDebug/:app:assembleDebug pass with Homebrew JDK 21, allowBackup=false, packaged backup/data-extraction exclusions, and app-scoped FileProvider paths; the debug APK SHA-256 remains 7439ae76464271f4dd26ae1ef7c4b5753b92ea52d49811b8d12244e53c4ae90f, but no Android emulator/device is attached. The last clean unsigned iOS Simulator Debug build/install/launch is the 2026-07-19 iPhone 17 evidence in artifacts/ios-simulator/staging-home.png. A 2026-07-20 rerun resolves the project and packages and validates Info.plist/PrivacyInfo.xcprivacy, but CoreSimulatorService repeatedly fails device-set allocation with Cannot allocate memory before asset compilation, including after a service-only restart. Release signing, final archive privacy report, store-console answers, push delivery, and real-device execution remain required"

external_checks:
  - name: "Cloudflare read-only state"
    target: "cloudflare-account"
    status: "partial"
    evidence: "2026-07-20 Wrangler OAuth, both web Worker histories, both API Worker dry-runs, separate staging/production COST_GUARD_STATE namespaces bound independently from CACHE, and Staging D1 through 0026 with no pending migrations and aligned registry/core seed evidence pass. The exact-host Turnstile widget/public key now exist and the staging Worker secret store lists SILSIGAN_TURNSTILE_SECRET_KEY plus SILSIGAN_PHOTO_UPLOAD_HMAC_SECRET without values. The staging API host has bootstrap/secret-change deployment history and undeployed version 1062068c-f06b-4090-9038-2b3d7b4cc9a1, but /api/health returns 404, so no application deployment or healthy API URL is claimed. The non-mutating check still returns R2_NOT_ENABLED, URL/origin blockers, and production D1_0006_NOT_APPLIED. WAF/static routing, Turnstile live smoke/production secret, and API application deployments remain pending"
  - name: "Public source activation"
    target: "provider-and-admin-console"
    status: "blocked"
    evidence: "Each source requires rights, attribution, credential owner, region, TTL, health, and audited enable evidence"
  - name: "NAVER Web Maps"
    target: "naver-cloud-console"
    status: "blocked_login_and_owner_domain"
    evidence: "2026-07-20 a separate Silsigan Dynamic Map form was prepared with localhost, the current staging/production workers.dev web hosts, and Android/iOS identifier kr.silsigan.mobile. Final registration was approved and attempted, but the NAVER console session had expired and returned authentication failure; no application or credential was created. The operator must log in again directly in Chrome before retrying. The shared hosts are preview inputs only and do not satisfy the owner-domain release gate. A same-day read-only Cloudflare Domains check shows no owner domain or subdomain. Domain selection and purchase/addition plus owner-domain origins, masked console limit/recipient evidence, valid-origin success, and invalid-origin rejection are still required"
  - name: "Ads"
    target: "future-m6-m8-gate"
    status: "deferred"
    evidence: "Ads and advertising SDKs remain disabled until separate M6 and M8 approval"

security:
  secrets:
    status: "pass_local"
    evidence: "No provider credential, token, stream URL, raw coordinate, or original filename is returned by public surfaces"
  authz:
    status: "pass_local"
    evidence: "Source policy, moderation, restriction, deletion, and identity link operations are deny-by-default and role, HMAC, or server-bound anonymous-proof gated; browser admin login/logout/moderation and Worker admin mutations enforce same-origin requests"
  validation:
    status: "pass_local"
    evidence: "Provider payloads, bridge commands, report observations, URLs, IDs, enums, and lengths are validated with negative tests"
  privacy:
    status: "pass_local"
    evidence: "Raw user coordinates and original photos are not stored; coarse buckets, re-encoded moderated variants, and SHA-256-only native push preference records are used. iOS packages a tracking-disabled PrivacyInfo manifest; Android denies app-data backup/device transfer and broad external-storage FileProvider access; the code-matched store disclosure remains a draft pending console and named review"
  abuse_controls:
    status: "pass_local"
    evidence: "A required 120 requests/minute hashed-IP Cloudflare limiter runs before D1, anonymous-session issuance has a separate 3/minute hashed-IP first-line edge limiter plus an exact D1-wide 5,000/day cap and 0 kill switch before session insert, recent valid sessions refresh last_seen_at at most once per 24 hours, streamed JSON stops at 64 KiB, upload tickets require server-validated Turnstile, photo reads use canonical cache plus a 1,000 cache-miss/IP/day HMAC ledger, 0022 prevents duplicate storage release across concurrent/retried delete paths, 0023 rejects stolen IDs without their separate proof, 0024 bounds distributed issuance, 0025 limits private place requests to 3/session/day and an exact 1,600/day global stop, and 0026 provides one-time 60% warning, 70% degradation, 80% critical reserve/stop, essential Worker snapshot, observed-usage reconciliation, and audited resume. The web layer additionally fails over to a verified static place directory without API/NAVER/telemetry/write calls. Route limits, duplicate suppression, approval-only publication, moderation, circuit breakers, retention cleanup, and audit records are covered"
  dependency_audit:
    status: "pass"
    evidence: "2026-07-20 pnpm audit --audit-level critical reports no known vulnerabilities"
  legal_operations:
    status: "blocked_expected"
    evidence: "docs/v2-legal-operations-gate.md requires named reviewers, dates, policy versions, and external evidence"

blockers:
  - id: "P0-SILSIGAN-D1-V2-MIGRATIONS"
    severity: "P0"
    status: "open"
    title: "Staging D1 is verified through 0026; production does not have the externally verified V2 chain."
    owner: "data-operations"
    evidence: "2026-07-20 latest deterministic read-only checks verify Staging schema through 0026, no pending Wrangler migrations, aligned registry, and core seed evidence. A protected pre-change external backup remains preserved. Staging upload smoke still requires post-0022 live R2/D1 reconciliation after R2 activation. Production remains at D1_0006_NOT_APPLIED and requires separate approval"
    due: "before_production_candidate"
  - id: "P0-SILSIGAN-R2-DASHBOARD"
    severity: "P0"
    status: "open"
    title: "Cloudflare R2 is user-approved but the user-only payment/terms activation and private-bucket evidence are pending."
    owner: "release-operator"
    evidence: "2026-07-20 a fresh read-only account check still returns R2_NOT_ENABLED after the user's Standard R2 approval. Cloudflare still requires user-entered payment details, billing/terms consents, and final activation. After enablement the release gate must prove every configured bucket exists, r2.dev is disabled, and no direct R2 custom domain exists; unknown privacy state fails closed. App guards stop at 3.2 GiB, 12,800 writes, 4,000 Images transformations, 800,000 monthly Class B reads, or 16,000 daily D1-tracked reads independently of billing email"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-GLOBAL-COST-GUARD-INFRA"
    severity: "P0"
    status: "open"
    title: "Live pre-Worker WAF and invocation-free static routing evidence is not complete."
    owner: "release-operator-and-security-owner"
    evidence: "Local 0026, admin control, rate-limit, warning, degradation, stop, Worker snapshot, strict web static directory, external-provider suppression, and reconciliation tests pass. Read-only account inspection confirms separate staging/production COST_GUARD_STATE namespaces and the config binds them independently from CACHE. The local matching-asset contract keeps run_worker_first false, but Cloudflare WAF/rate-limit rules and invocation-free static routing still need live evidence because requests are counted before Worker code can reject them"
    due: "before_staging_api_deploy"
  - id: "P0-SILSIGAN-TURNSTILE"
    severity: "P0"
    status: "open"
    title: "Turnstile staging configuration exists; live activation/smoke and the production secret remain pending."
    owner: "release-operator-and-security-owner"
    evidence: "Local client/server integration and failure tests pass. The exact-host widget covers the current staging/production web hosts, source commit 30360956cd4aad29b145dce664f8bc7943bd5874 configures the public SILSIGAN_TURNSTILE_SITE_KEY, and the staging secret store lists SILSIGAN_TURNSTILE_SECRET_KEY plus SILSIGAN_PHOTO_UPLOAD_HMAC_SECRET without values. Bootstrap/secret-change versions are present but the application is not live; /api/health returns 404 and version 1062068c-f06b-4090-9038-2b3d7b4cc9a1 remains undeployed. After R2 enablement, deploy the configured application, capture success/failure smoke, and install the production secret only at the production gate"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-DEPLOYMENT-URLS"
    severity: "P0"
    status: "open"
    title: "The staging API secret target exists, but application deployment and healthy API URLs are missing."
    owner: "release-operator"
    evidence: "2026-07-20 web URLs remain https://silsigan-web-staging.dudqks0319.workers.dev and https://silsigan-web-production.dudqks0319.workers.dev; both web Worker histories and read-only staging smoke pass. workers/api/wrangler.jsonc pins each API environment to its exact matching web origin. The staging API host has bootstrap/secret-change history but /api/health returns 404 because the configured application is not deployed; no healthy staging API URL is claimed, and the production API Worker remains missing"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-NAVER-WEB-MAPS"
    severity: "P0"
    status: "open"
    title: "NAVER Web Maps requires an owner-controlled custom domain plus console key, limit, and notification evidence."
    owner: "release-operator"
    evidence: "2026-07-20 the Silsigan Dynamic Map form contains localhost development origins, the staging and production workers.dev preview origins, and Android/iOS identifier kr.silsigan.mobile. Final registration was approved and attempted, but the NAVER console session had expired and returned authentication failure; no application or credential was created. The operator must log in again directly in Chrome before retrying. workers.dev remains preview-only: the release gate requires an owner-controlled custom domain plus representative-account, monthly 4,800,000, daily 160,000, 70% alert, and recipient-confirmation evidence. Domain selection and addition, final NAVER registration with owner-controlled production origins, masked console limit/recipient evidence, valid-origin success, and invalid-origin rejection evidence remain pending"
    due: "before_staging_browser_smoke"
  - id: "P0-SILSIGAN-SOURCE-RIGHTS"
    severity: "P0"
    status: "open"
    title: "Public data and media sources lack source-by-source rights and activation evidence."
    owner: "data-operations-and-legal-safety"
    evidence: "docs/current-release-state.md"
    due: "before_each_source_enable"
  - id: "P0-SILSIGAN-STAGING-OPERATIONS"
    severity: "P0"
    status: "open"
    title: "Live moderation queue and staging mutation, admin, R2, source, and tail evidence are missing."
    owner: "trust-safety-and-release-operator"
    evidence: "MODERATION_ALERT_WEBHOOK_URL; docs/current-release-state.md"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-REAL-DEVICE-QA"
    severity: "P0"
    status: "open"
    title: "Capacitor release signing, final privacy report, push delivery, and iPhone/Android real-device evidence are incomplete."
    owner: "mobile-release"
    evidence: "docs/current-release-state.md"
    due: "before_internal_testing"
  - id: "P0-SILSIGAN-LEGAL-SIGNOFF"
    severity: "P0"
    status: "open"
    title: "Privacy, location, UGC, account deletion, source terms, and store disclosures lack named sign-off."
    owner: "legal-safety"
    evidence: "docs/current-release-state.md"
    due: "before_external_testflight_review"
  - id: "P1-SILSIGAN-ANONYMOUS-SESSION-BINDING"
    severity: "P1"
    status: "open"
    title: "Server-bound anonymous-proof migrations are on staging; API/owner-domain deployment and live replay/rotation/revocation evidence are still missing."
    owner: "identity-and-security"
    evidence: "2026-07-20 local migration 0023 stores only SHA-256 session/proof hashes and 0024 adds an exact D1-wide UTC-day issuance budget; both now pass Staging schema evidence. Staging/production deployments require SILSIGAN_ANON_SESSION_REQUIRED=1 and default SILSIGAN_ANON_SESSION_DAILY_LIMIT=5000. Worker and harness tests reject a stolen ID without its 256-bit proof, an incorrect or rotated proof, a revoked proof, distributed issuance beyond the exact cap, and any issuance when the cost ledger is missing. A distinct Cloudflare binding reduces first-line traffic at 3/minute per hashed IP, while D1 is authoritative because the edge limiter is location-local; last_seen_at refreshes at most once per 24 hours and Cron removes expired/old-revoked sessions and old budget rows. No owner-domain live evidence exists; theft of the complete ID+proof bearer pair remains a residual risk until stronger member/device binding is selected"
    due: "before_broad_public_launch"
  - id: "P1-SILSIGAN-PRIVACY-SUPPORT-URLS"
    severity: "P1"
    status: "closed"
    title: "Final public privacy policy and support URLs are selected and live."
    owner: "release-operator"
    evidence: "2026-07-19 https://silsigan-web-production.dudqks0319.workers.dev/privacy and /support both returned HTTP 200 text/html and contained the app privacy, location, photo, report, deletion, and support terms. .env.example records the selected SILSIGAN_PRIVACY_POLICY_URL and SILSIGAN_SUPPORT_URL values"
    due: "before_external_testflight_review"

next_action:
  owner: "release-operator"
  command: "pnpm cf:r2:evidence -- --env=staging --apply --check --timeout-ms=120000"
  description: "Run after the user completes Cloudflare's payment/terms activation hand-off; create only the private staging bucket, then verify bucket visibility, disabled r2.dev, and no direct R2 custom domain before any API Worker deploy."
