local_checks:
  - name: "Lint"
    command: "pnpm lint"
    status: "pass"
    evidence: "2026-07-20 pass"
  - name: "Typecheck"
    command: "pnpm typecheck"
    status: "pass"
    evidence: "2026-07-20 pass"
  - name: "Full tests"
    command: "npm test"
    status: "pass"
    evidence: "2026-07-20 413 passed, 0 failed, 0 skipped; existing API/R2/D1/realtime coverage plus public GET/HEAD without session issuance, continued public reads after the exact issuance budget is exhausted, same-origin admin mutations, approval-only realtime publication, per-photo current-version shooting/publishing-rights validation before Turnstile/D1, idempotent anonymous community acceptance recording, Turnstile action/hostname/IP validation, provider fail-closed behavior, the 0020 Images singleton, 0021 hashed per-IP read ledger, 0022 idempotent storage-release ledger, 0023 server-bound anonymous proofs, 0024 exact D1-wide anonymous-session issuance budget, 0025 private owner-only place-addition queue with per-session and global 80% triggers, 0026 global Workers/D1 cost guard, health-ledger admission, forged-proof authentication-cost reservation, exact pre-reservation admin role checks, atomic resume safety recheck, private review fields, duplicate-safe admin classification without automatic place creation, a dedicated 3/minute hashed-IP first-line limiter, 5,000/day compiled ceiling and 0 kill switch before session insert, expired/revoked-session cleanup, 24-hour last-seen write throttling, stolen-ID/wrong-proof/rotation/revocation rejection, proof tail redaction, concurrent delete fencing, canonical cache bypass controls, Cloudflare-IP-first Next limiter identity that ignores User-Agent rotation, fail-closed 4,096-entry bounds for both Next and API Worker fallback limiter storage, expired Worker identity reclamation, public-release URL allowlist fallback coverage, fail-closed R2 dev-URL/custom-domain privacy evidence, 80% resume reconciliation, bounded security-ledger retention, safe client errors, aggregate-only KPI parsing, native HEIC-to-JPEG magic-byte validation, native privacy/backup contracts, release-evidence manifest preparation, and store-disclosure gates"
  - name: "Source ingestion scheduler"
    command: "npm test"
    status: "ready_local_activation_blocked"
    evidence: "2026-07-20 local migrations 0018 through 0026 pass. Deterministic Staging schema evidence verifies scheduler/delivery, Images transformation, per-IP read-abuse, idempotent storage-release, hashed anonymous-session proof, exact anonymous-session issuance-budget, and private place-request objects through 0025, with first schema gap D1_0026_NOT_APPLIED. Wrangler nevertheless lists 0018 through 0026 pending, so the guarded operator surface returns D1_MIGRATION_REGISTRY_DRIFT and blocks mutating apply before execution. Applied 0022 keeps uploads stopped until live R2/D1 reconciliation"
  - name: "Global Workers and D1 cost guard"
    command: "npm test"
    status: "pass_local_external_bindings_blocked"
    evidence: "0026 atomically reserves conservative route weights, accepts higher Cloudflare-observed values, emits one redacted 60% warning per day, degrades non-essential work at 70%, preserves the final reserve only for privacy/emergency controls to 80%, serves essential nationwide reads from a D1-write-free Worker snapshot, and requires a fresh below-70% reconciliation before resume. A second matching-static-asset layer keeps five verified place locations available after API Worker exhaustion while suppressing live state, photos, reports, scores, telemetry, retries, realtime, NAVER/external search, and writes; strict parser and Wrangler run_worker_first=false contract tests pass. The 2026-07-20 local Chrome 503 harness observed two initial API requests, one static-directory request, then zero post-fallback API, NAVER-provider, or analytics requests; it stored no request bodies. Artifacts are under artifacts/static-directory-failover with timestamp 1784507359630. Health checks pass both edge admission and the global ledger, forged anonymous proofs reserve authentication lookup cost before D1, admin routes verify the exact minimum role before protected-capacity reservation, and resume safety is rechecked inside the same D1 transaction. A dedicated COST_GUARD_STATE KV plus live WAF/invocation-free static-routing evidence remain external blockers"
  - name: "Public source fallback evidence"
    command: "pnpm evidence:public-sources"
    status: "pass_local"
    evidence: "2026-07-20 KMA, TourAPI, national parking, national traffic, national CCTV, and Seoul realtime fixtures pass network/fresh/stale-degraded/expired-insufficient transitions; the aggregate-only artifact reports passedSources=6, failedSources=0, sensitiveHits=[] under artifacts/public-source-fallback-local/public-source-fallback.json. Real rights, credentials, quotas, health, and staging ingestion remain external"
  - name: "Cloudflare Worker rollback drill"
    command: "pnpm cf:rollback:drill -- --env=staging --kind=web --check"
    status: "pass_readonly_candidate_actual_drill_pending"
    evidence: "2026-07-20 the non-mutating harness resolved the exact staging web Worker, read deployment history only, selected current e87e79d5-5d30-43dc-adfe-1b5393a3b8d2 and previous stable d7c2bab9-101f-4d2c-a8c3-0b02e9f6e14e, emitted no author/message/raw-error data, and recorded mutationsPerformed=false under artifacts/cloudflare-rollback-drill/staging-web-readonly.json. Actual rollback, smoke, and forward restoration remain explicit-approval gates; Worker rollback excludes D1/R2/KV/Durable Objects/migrations/secrets"
  - name: "R2 cost-guard Computer Use QA"
    command: "manual Chrome operator flow"
    status: "pass_local"
    evidence: "2026-07-19 local Chrome authenticated through the same-origin JSON route and rendered five storage/write/Images-transform/monthly-read/daily-read meters plus aggregate-only beta KPIs; a recorded reason stopped uploads and reads together, and re-enable stayed locked until a new reason plus D1 ledger acknowledgement before returning to protection-on. Evidence: artifacts/cloudflare-pages-smoke-worker-report-local/pages-smoke-admin-cost-guard-stopped-1784459655424.png and pages-smoke-admin-cost-guard-running-1784459655424.png"
  - name: "Production build"
    command: "pnpm build"
    status: "pass"
    evidence: "2026-07-20 Next.js 16.2.6 compiled without warnings and generated the application manifest including /api/admin/photo-cost-guard and /api/admin/beta-kpis"
  - name: "Cloudflare type generation"
    command: "pnpm cf:typegen"
    status: "pass_local"
    evidence: "2026-07-20 generated CloudflareEnv types from tracked .env.example keys, including SILSIGAN_ANON_SESSION_REQUIRED and SILSIGAN_ANON_SESSION_DAILY_LIMIT, with exit status 0"
  - name: "OpenNext Cloudflare build"
    command: "pnpm cf:build"
    status: "pass_local"
    evidence: "2026-07-20 generated .open-next/worker.js and 140 assets for Next.js 16.2.6; staging and production frontend/API Wrangler dry-runs passed without deploying or changing traffic"
  - name: "V2 decision and legal operations docs"
    command: "node scripts/release-state-check.mjs"
    status: "pass_local"
    evidence: "Decision register and legal operations gate are present, tokenized, and redaction checked"
