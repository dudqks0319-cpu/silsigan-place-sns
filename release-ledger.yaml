schema_version: 1

project:
  name: "silsigan"
  slug: "silsigan"
  platforms:
    - "nextjs"
    - "cloudflare-workers"
    - "cloudflare-d1"
    - "cloudflare-r2"
    - "cloudflare-durable-objects"
  owner: "me"
  release_goal: "Supabase/Vercel regional MVP에서 Cloudflare 기반 전국 실시간 장소 앱으로 전환하고 staging/production 운영 증적을 분리 검증한다."

candidate:
  phase: "local_ready_external_blocked"
  version: "0.1.0"
  build_number: "not_applicable"
  git_sha: "39289821cfc891a5fbb30024855728b5d0c2052c"
  branch: "agent/silsigan-map-tourism-ui-20260628"
  dirty_state: "pushed_agent_branch; staging/production web Workers deployed, public web/API URL exports documented, staging D1 first-launch seed applied, and mobile TestFlight shell public links guarded by release:status"
  source_of_truth: "docs/current-release-state.md"

local_checks:
  - name: "Targeted Cloudflare API tests"
    command: "pnpm test"
    status: "pass"
    evidence: "130 tests passed on 2026-06-28 after pushing 3928982, including first-launch Busan/Gyeongju/Ulsan seed coverage, D1 ranking abuse smoke, UGC moderation runbook guard coverage, Cloudflare cost/usage runbook guard coverage, TestFlight review notes guard coverage, real-device QA ledger guard coverage, public privacy/support page guard coverage, privacy/support URL guard coverage, mobile TestFlight shell guard coverage, auth-aware external-state blocker canonicalization, and Worker deployment absence classification"
  - name: "Release status open blocker guard"
    command: "node scripts/release-state-check.mjs --strict"
    status: "blocked_expected"
    evidence: "release_harness.ledger.open_blockers fails with remaining open P0 release blockers; release_harness.status.open_blocker_evidence, ugc_moderation.runbook.required_tokens, mobile_testflight.app/app_config/experience gates, and ledger.next_actions.duplicate_lines pass and would fail status/ledger/runbook/mobile drift; 2026-06-28 .env.example defines staging/production API URL values, so URL shape preflight can pass while cf:external-state still surfaces R2_NOT_ENABLED and remaining API worker_deployment blockers"
  - name: "UGC moderation runbook gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/ugc-moderation-runbook.md includes ownership, MODERATION_ALERT_WEBHOOK_URL intake, 12h/24h/72h SLA, comment/photo targets, hide/restore/delete/restrict actions, evidence/audit, escalation, and stop conditions"
  - name: "Cloudflare cost and usage runbook gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/cloudflare-cost-usage-runbook.md includes Usage & billing dashboard checks, Billing alerts, daily/weekly evidence cadence, R2/D1/Workers/Durable Objects/Cloudflare Images metrics, budget thresholds, and TestFlight stop conditions"
  - name: "TestFlight review notes gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/testflight-review-notes.md includes beta description, reviewer instructions, staging URL requirements, permission copy, UGC moderation, privacy policy URL/support URL status, staging evidence, and stop conditions"
  - name: "Privacy and support URL gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "blocked_expected"
    evidence: "release:status now requires SILSIGAN_PRIVACY_POLICY_URL and SILSIGAN_SUPPORT_URL to be distinct HTTPS URLs before external TestFlight review notes can be submitted"
  - name: "Real-device QA ledger gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "docs/real-device-qa.md now guards required iPhone/Android QA matrices, staging environment fields, permission flows, UGC flows, redaction requirements, crash checks, and artifact naming before TestFlight internal testing"
  - name: "Public privacy/support page gate"
    command: "node scripts/release-state-check.mjs --strict"
    status: "pass_local"
    evidence: "/privacy and /support page source now guards implemented data handling, TestFlight support, content reports, deletion requests, and final URL language before live privacy/support env URLs can be accepted"
  - name: "Mobile TestFlight public URL shell"
    command: "cd apps/mobile && pnpm lint && pnpm typecheck && pnpm test"
    status: "pass_local"
    evidence: "apps/mobile exposes privacy, support, and staging web link controls in the My tab, app.json extra.silsigan contains the same public URLs, release:status guards mobile UI/service-link/app-config URL and permission metadata, and 5 mobile tests pass including release-shaped public URL coverage"
  - name: "Release gate plan"
    command: "pnpm release:gate -- --plan-only"
    status: "pass"
    evidence: "docs/current-release-state.md; staging.api.smoke and pages.browser.smoke expose required staging URL envKeys"
  - name: "Release gate collect blockers"
    command: "pnpm release:gate -- --skip-verify --skip-dry-run --collect-blockers --tail-file=tests/fixtures/redacted-worker-tail.log --timeout-ms=120000"
    status: "blocked_expected"
    evidence: "2026-06-26 resultCounts pass=9 fail=7; tail redaction, audit, typegen, build, frontend dry-runs, staging D1 evidence, and production D1 evidence pass; failures converge on open ledger blockers, missing URLs, R2_NOT_ENABLED, BASE_URL_REQUIRED, and PAGES_URL_REQUIRED"
  - name: "Git diff whitespace check"
    command: "git diff --check"
    status: "pass"
    evidence: "No output on 2026-06-27"

runtime_checks:
  - name: "Local Pages browser report"
    target: "local"
    status: "pass"
    evidence: "pnpm smoke:pages:local-report -- --timeout-ms=60000: map.visible, map.controlsUncovered, click controls, reports, redaction pass; screenshot artifacts/cloudflare-pages-smoke-worker-report-local/pages-smoke-1782360662137.png"
  - name: "Staging Worker smoke"
    target: "cloudflare-staging"
    status: "blocked"
    evidence: "SILSIGAN_STAGING_API_BASE_URL is configured as https://silsigan-api-staging.dudqks0319.workers.dev, but the staging API Worker is not yet deployed/smoked"
  - name: "Staging Pages browser smoke"
    target: "cloudflare-staging"
    status: "pass_read_only"
    evidence: "2026-06-27 pnpm smoke:pages -- --pages-url=https://silsigan-web-staging.dudqks0319.workers.dev --timeout-ms=60000 passed map surface/visibility, uncovered controls, bottom nav, ranking detail, and marker detail; mutating/share checks intentionally skipped"
  - name: "Production Pages browser smoke"
    target: "cloudflare-production"
    status: "pass_read_only"
    evidence: "2026-06-27 pnpm smoke:pages -- --pages-url=https://silsigan-web-production.dudqks0319.workers.dev --timeout-ms=60000 passed map surface/visibility, uncovered controls, bottom nav, ranking detail, and marker detail; mutating/share checks intentionally skipped"

external_checks:
  - name: "Staging D1 posts/questions migration"
    target: "cloudflare-d1-staging"
    status: "pass"
    evidence: "2026-06-28 pnpm cf:d1:evidence -- --env=staging --apply --timeout-ms=120000: no pending migrations, seed apply processed 9 queries, and follow-up remote query returned launch_focus_count=12 for the Busan/Gyeongju/Ulsan first-launch places; posts=4, questions=3"
  - name: "Production D1 posts/questions migration"
    target: "cloudflare-d1-production"
    status: "pass"
    evidence: "pnpm cf:d1:evidence -- --env=production --apply --confirm-production --timeout-ms=120000 and follow-up --check: no pending migrations, posts=4, questions=3; 2026-06-27 pnpm cf:external-state reconfirmed production D1 0002 with posts=4, questions=3"
  - name: "R2 account and buckets"
    target: "cloudflare-r2"
    status: "blocked"
    evidence: "2026-06-27 pnpm cf:r2:evidence -- --env=staging --check --timeout-ms=120000: R2_NOT_ENABLED; Cloudflare docs require adding an R2 subscription through Dashboard checkout before bucket evidence can pass"
  - name: "Deployment URLs"
    target: "cloudflare-pages-workers"
    status: "partial"
    evidence: "Staging web Worker silsigan-web-staging and production web Worker silsigan-web-production are deployed at https://silsigan-web-staging.dudqks0319.workers.dev and https://silsigan-web-production.dudqks0319.workers.dev with HTTP 200/read-only Pages smoke pass; .env.example and docs/cloudflare-staging-operator-packet.md define public Pages/API/privacy/support URL values including https://silsigan-api-staging.dudqks0319.workers.dev and https://silsigan-api-production.dudqks0319.workers.dev; remaining hard blockers are worker_deployment.staging.api and worker_deployment.production.api until API deploy/smoke pass"
  - name: "Staging web Worker deploy"
    target: "cloudflare-workers-staging-web"
    status: "pass"
    evidence: "2026-06-27 pnpm cf:build pass, pnpm cf:web:dry-run:staging pass, wrangler deploy --config wrangler.jsonc --env staging uploaded silsigan-web-staging version 1f78ede2-80c6-4ac6-8388-305bfa8b4a1c, curl -I returned HTTP 200"
  - name: "Production web Worker deploy"
    target: "cloudflare-workers-production-web"
    status: "pass"
    evidence: "2026-06-27 pnpm cf:build pass, pnpm cf:web:dry-run:production pass, wrangler deploy --config wrangler.jsonc --env production uploaded silsigan-web-production version 2c136948-8a7e-450a-93d4-0fe8d5d8fcdb, curl -I returned HTTP 200"

security:
  secrets:
    status: "pass_local"
    evidence: "release gate and smoke artifacts redact token, coordinate, anonymous id, original filename patterns"
  authz:
    status: "pass_local"
    evidence: "tests/cloudflare-api.test.ts covers deny-by-default admin token, role gates, moderation, and user restrictions"
  privacy:
    status: "pass_local"
    evidence: "tests cover coarse radius, no raw coordinates in public responses, EXIF/GPS stripping, and filename minimization"
  abuse_controls:
    status: "pass_local"
    evidence: "D1 ranking abuse smoke proves repeated same-user place click/like attempts return created=false and do not inflate ranking counts, unique_user_count, or live score"
  ugc_moderation:
    status: "pass_local"
    evidence: "docs/ugc-moderation-runbook.md defines owner, report intake queue, SLA, operator actions, audit evidence, escalation, and stop conditions; live webhook secret verification remains staging-blocked"
  cloudflare_cost_usage:
    status: "pass_local"
    evidence: "docs/cloudflare-cost-usage-runbook.md defines owner, dashboard checks, baseline thresholds, Billing alerts, evidence cadence, and stop conditions; live billing dashboard evidence remains staging-blocked"
  testflight_review_notes:
    status: "pass_local"
    evidence: "docs/testflight-review-notes.md defines beta app description, reviewer instructions, permissions, UGC moderation, privacy/support URL status, staging evidence, and stop conditions; HTTPS privacy/support URL values are defined, but final external TestFlight notes still require release-shell export and confirmation"
  mobile_testflight_shell:
    status: "pass_local"
    evidence: "apps/mobile My tab exposes public privacy/support/staging web links; expo config includes iOS camera/location/photo usage strings, Android camera/location permissions, and extra.silsigan public URLs; release:status now fails if mobile TestFlight shell UI tokens, service links, permission metadata, or URL shape drift; real-device QA remains blocked until staging API/R2 are ready"
  real_device_qa:
    status: "blocked_expected"
    evidence: "docs/real-device-qa.md defines the iPhone/Android QA matrix and evidence artifact rules; actual iPhone/Android device evidence remains blocked until staging URLs and R2 pass"
  public_policy_support_pages:
    status: "pass_local"
    evidence: "src/app/privacy/page.tsx and src/app/support/page.tsx exist and release:status verifies required public-page tokens; HTTPS SILSIGAN_PRIVACY_POLICY_URL and SILSIGAN_SUPPORT_URL values are defined in .env.example/operator docs and still require actual release-shell export"
  privacy_support_urls:
    status: "blocked_expected"
    evidence: "SILSIGAN_PRIVACY_POLICY_URL and SILSIGAN_SUPPORT_URL must be distinct HTTPS URLs without placeholders, credentials, query params, fragments, or localhost hosts; .env.example now provides release-shaped values"
  payments_legal:
    status: "not_applicable"
    evidence: "No payment flow in current release scope"

blockers:
  - id: "P0-SILSIGAN-R2-DASHBOARD"
    severity: "P0"
    status: "open"
    title: "Cloudflare R2 account subscription is not enabled, blocking Worker deploy and staging photo smoke."
    owner: "me"
    evidence: "R2_NOT_ENABLED; Cloudflare Dashboard > Storage & databases > R2 > Overview checkout required"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-DEPLOYMENT-URLS"
    severity: "P0"
    status: "open"
    title: "Staging/production Pages and API URL values are defined, but staging/production API Workers are not deployed and smoked."
    owner: "me"
    evidence: "staging web pass at https://silsigan-web-staging.dudqks0319.workers.dev and production web pass at https://silsigan-web-production.dudqks0319.workers.dev; .env.example/operator packet define public web/API/privacy/support URL values; remaining blockers are worker_deployment.staging.api and worker_deployment.production.api until deploy/smoke pass"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-PRODUCTION-D1-0002"
    severity: "P0"
    status: "resolved"
    title: "Production D1 has 0002_posts_questions.sql and seed evidence."
    owner: "me"
    evidence: "pnpm cf:d1:evidence -- --env=production --check --timeout-ms=120000 and 2026-06-27 pnpm cf:external-state: no pending migrations/evidence gap, posts=4, questions=3"
    due: "resolved_2026-06-26"
  - id: "P0-SILSIGAN-STAGING-SMOKE"
    severity: "P0"
    status: "open"
    title: "Real staging Worker, Pages, R2/Images mutation, admin moderation, and tail redaction smoke are not captured yet."
    owner: "me"
    evidence: "docs/current-release-state.md"
    due: "before_public_release"
  - id: "P0-SILSIGAN-REAL-DEVICE-QA"
    severity: "P0"
    status: "open"
    title: "iPhone and Android real-device QA evidence is not captured against live Cloudflare staging."
    owner: "me"
    evidence: "docs/real-device-qa.md"
    due: "before_testflight_internal_testing"
  - id: "P1-SILSIGAN-PRIVACY-SUPPORT-URLS"
    severity: "P1"
    status: "open"
    title: "Privacy policy and support URL values are defined, but final external TestFlight shell export is not confirmed."
    owner: "me"
    evidence: ".env.example defines SILSIGAN_PRIVACY_POLICY_URL and SILSIGAN_SUPPORT_URL; actual external TestFlight review notes still need final shell export confirmation"
    due: "before_external_testflight_review"

next_action:
  owner: "me"
  command: "pnpm cf:r2:evidence -- --env=staging --check --timeout-ms=60000"
  description: "After adding the R2 subscription in Cloudflare Dashboard checkout, verify bucket visibility, deploy the staging API Worker at the committed API URL, export the committed public web/API/privacy/support URL values, and continue to real staging smoke."
