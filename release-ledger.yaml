schema_version: 1

project:
  name: "silsigan"
  slug: "silsigan"
  platforms:
    - "nextjs"
    - "cloudflare-workers"
    - "cloudflare-d1"
    - "cloudflare-r2"
    - "cloudflare-durable-objects"
    - "capacitor-ios-android"
  owner: "me"
  release_goal: "방문 가능 여부를 신뢰 가능한 현재 데이터로 판단하는 V2를 Cloudflare와 Capacitor 구조로 검증한다."

candidate:
  phase: "v2_local_ready_external_blocked"
  version: "0.1.0"
  build_number: "not_applicable"
  git_sha: "8198cf745d59895ae28bdd46bc8b32016505308a"
  branch: "codex/silsigan-progress-20260710"
  dirty_state: "working_tree_contains_reviewed_v2_implementation_not_committed_or_pushed"
  source_of_truth: "docs/current-release-state.md"

local_checks:
  - name: "Lint"
    command: "pnpm lint"
    status: "pass"
    evidence: "2026-07-10 pass"
  - name: "Typecheck"
    command: "pnpm typecheck"
    status: "pass"
    evidence: "2026-07-10 pass"
  - name: "Full tests"
    command: "pnpm test"
    status: "pass"
    evidence: "2026-07-10 184 passed, 0 failed"
  - name: "Production build"
    command: "pnpm build"
    status: "pass"
    evidence: "Next.js 16.2.6 compiled without warnings and generated 21 routes"
  - name: "V2 decision and legal operations docs"
    command: "node scripts/release-state-check.mjs"
    status: "pass_local"
    evidence: "Decision register and legal operations gate are present, tokenized, and redaction checked"

runtime_checks:
  - name: "Local V2 mobile browser proof"
    target: "local"
    status: "pass"
    evidence: "2026-07-10 390x844 smoke passed 31 required interactions; home/map screenshots and redacted network/console artifacts are under artifacts/silsigan-v2-local-report-20260710"
  - name: "Staging Worker and Pages smoke"
    target: "cloudflare-staging"
    status: "blocked"
    evidence: "Selected HTTPS Pages and API URLs plus deployed staging API Worker are required"
  - name: "Capacitor real-device QA"
    target: "ios-android"
    status: "blocked"
    evidence: "Native projects, signing, staging build, and docs/real-device-qa.md execution are required"

external_checks:
  - name: "Cloudflare read-only state"
    target: "cloudflare-account"
    status: "blocked"
    evidence: "2026-07-10 auth and dry-runs pass; V2 D1, R2, API Worker, and URL blockers remain"
  - name: "Public source activation"
    target: "provider-and-admin-console"
    status: "blocked"
    evidence: "Each source requires rights, attribution, credential owner, region, TTL, health, and audited enable evidence"
  - name: "NAVER Web Maps"
    target: "naver-cloud-console"
    status: "blocked"
    evidence: "Exact staging and production HTTPS origin restriction evidence is required"
  - name: "Ads"
    target: "future-m6-m8-gate"
    status: "deferred"
    evidence: "Ads and advertising SDKs remain disabled until separate M6 and M8 approval"

security:
  secrets:
    status: "pass_local"
    evidence: "No provider credential, token, stream URL, raw coordinate, or original filename is returned by public surfaces"
  authz:
    status: "pass_local"
    evidence: "Source policy, moderation, restriction, deletion, and identity link operations are deny-by-default and role or HMAC gated"
  validation:
    status: "pass_local"
    evidence: "Provider payloads, bridge commands, report observations, URLs, IDs, enums, and lengths are validated with negative tests"
  privacy:
    status: "pass_local"
    evidence: "Raw user coordinates and original photos are not stored; coarse buckets and re-encoded moderated variants only"
  abuse_controls:
    status: "pass_local"
    evidence: "Rate limits, duplicate suppression, report votes, blocks, restrictions, moderation, source circuit breakers, and audit records are covered"
  dependency_audit:
    status: "pass"
    evidence: "2026-07-10 pnpm audit reports no known vulnerabilities after Capacitor dependencies were added"
  legal_operations:
    status: "blocked_expected"
    evidence: "docs/v2-legal-operations-gate.md requires named reviewers, dates, policy versions, and external evidence"

blockers:
  - id: "P0-SILSIGAN-D1-V2-MIGRATIONS"
    severity: "P0"
    status: "open"
    title: "Staging and production D1 do not have the V2 migration chain through 0006."
    owner: "data-operations"
    evidence: "D1_0006_NOT_APPLIED"
    due: "before_v2_staging_smoke"
  - id: "P0-SILSIGAN-R2-DASHBOARD"
    severity: "P0"
    status: "open"
    title: "Cloudflare R2 account subscription is not enabled."
    owner: "release-operator"
    evidence: "R2_NOT_ENABLED"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-DEPLOYMENT-URLS"
    severity: "P0"
    status: "open"
    title: "API Workers and selected staging/production deployment URLs are missing."
    owner: "release-operator"
    evidence: "WORKER_DEPLOYMENT_MISSING; deployment_url.*"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-NAVER-WEB-MAPS"
    severity: "P0"
    status: "open"
    title: "NAVER Web Maps service and exact HTTPS origin restrictions lack console evidence."
    owner: "release-operator"
    evidence: "SILSIGAN_NAVER_MAP_WEB_MAPS_CONFIRMED; SILSIGAN_NAVER_MAP_ALLOWED_ORIGINS"
    due: "before_staging_browser_smoke"
  - id: "P0-SILSIGAN-SOURCE-RIGHTS"
    severity: "P0"
    status: "open"
    title: "Public data and media sources lack source-by-source rights and activation evidence."
    owner: "data-operations-and-legal-safety"
    evidence: "docs/current-release-state.md"
    due: "before_each_source_enable"
  - id: "P0-SILSIGAN-STAGING-OPERATIONS"
    severity: "P0"
    status: "open"
    title: "Live moderation queue and staging mutation, admin, R2, source, and tail evidence are missing."
    owner: "trust-safety-and-release-operator"
    evidence: "MODERATION_ALERT_WEBHOOK_URL; docs/current-release-state.md"
    due: "before_staging_release_candidate"
  - id: "P0-SILSIGAN-REAL-DEVICE-QA"
    severity: "P0"
    status: "open"
    title: "Capacitor native projects, signing, and iPhone/Android evidence are incomplete."
    owner: "mobile-release"
    evidence: "docs/current-release-state.md"
    due: "before_internal_testing"
  - id: "P0-SILSIGAN-LEGAL-SIGNOFF"
    severity: "P0"
    status: "open"
    title: "Privacy, location, UGC, account deletion, source terms, and store disclosures lack named sign-off."
    owner: "legal-safety"
    evidence: "docs/current-release-state.md"
    due: "before_external_testflight_review"
  - id: "P1-SILSIGAN-PRIVACY-SUPPORT-URLS"
    severity: "P1"
    status: "open"
    title: "Final public privacy policy and support URLs are not configured."
    owner: "release-operator"
    evidence: "SILSIGAN_PRIVACY_POLICY_URL; SILSIGAN_SUPPORT_URL"
    due: "before_external_testflight_review"

next_action:
  owner: "data-operations"
  command: "pnpm cf:d1:evidence -- --env=staging --check --timeout-ms=120000"
  description: "Review, back up, and separately approve staging V2 migrations before any apply action; then verify the remote chain through 0006."
