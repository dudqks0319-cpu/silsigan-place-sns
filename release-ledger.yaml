security:
  secrets:
    status: "pass_local"
    evidence: "No provider credential, token, stream URL, raw coordinate, or original filename is returned by public surfaces"
  authz:
    status: "pass_local"
    evidence: "Source policy, moderation, restriction, deletion, and identity link operations are deny-by-default and role, HMAC, or server-bound anonymous-proof gated; browser admin login/logout/moderation and Worker admin mutations enforce same-origin requests"
  validation:
    status: "pass_local"
    evidence: "Provider payloads, bridge commands, report observations, URLs, IDs, enums, and lengths are validated with negative tests"
  privacy:
    status: "pass_local"
    evidence: "Raw user/photo coordinates and original photos are not stored; photo tickets and public output retain only coarse client-reported radius/accuracy evidence and explicitly disclaim physical-presence/identity verification. Re-encoded moderated variants and SHA-256-only native push preference records are used. iOS packages a tracking-disabled PrivacyInfo manifest; Android denies app-data backup/device transfer and broad external-storage FileProvider access; the code-matched store disclosure remains a draft pending console and named review"
  abuse_controls:
    status: "pass_local"
    evidence: "A required 120 requests/minute hashed-IP Cloudflare limiter runs before D1, anonymous-session issuance has a separate 3/minute hashed-IP edge limiter plus an exact D1-wide 5,000/day cap and 0 kill switch, streamed JSON stops at 64 KiB, and photo tickets require authenticated proof, server-validated client location, exact-host Turnstile, size/type/dimension limits, one-use/idempotent claims, per-session/fingerprint quotas, cost budgets, and fail-closed dependencies before R2. Photo reads use canonical cache plus a 1,000 cache-miss/IP/day HMAC ledger; 0022 prevents duplicate storage release; 0023 rejects stolen IDs without proofs; 0024 bounds issuance; 0025 limits private place requests; and 0026 provides warning/degradation/stop/reconciliation. Provider budgets, directory failover, duplicate suppression, approval-only publication, moderation, circuit breakers, retention cleanup, and audit records remain covered"
  dependency_audit:
    status: "pass"
    evidence: "2026-07-24 same-day pnpm audit:security checked root and mobile lockfiles at low severity and reported no known vulnerabilities; no dependency or lockfile changed in the photo-location remediation. A later fresh metadata fetch was denied by outbound dependency-metadata policy and was not misreported as a refreshed audit. The final tracked-source secret/log scans reported zero new assignments or coordinate/token logging"
  legal_operations:
    status: "blocked_expected"
    evidence: "docs/v2-legal-operations-gate.md requires named reviewers, dates, policy versions, and external evidence"

