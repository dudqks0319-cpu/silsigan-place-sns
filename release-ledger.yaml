    target: "cloudflare-account"
    status: "partial"
    evidence: "2026-07-20 Wrangler OAuth, both web Worker histories, and all four web/API Worker dry-runs pass. The non-mutating check returns R2_NOT_ENABLED, both API Worker deployments missing, URL/origin blockers, staging D1_0026_NOT_APPLIED plus D1_MIGRATION_REGISTRY_DRIFT, and production D1_0006_NOT_APPLIED. Staging schema is verified through 0025, but its Wrangler registry reports 0018 through 0026 pending; mutation stays blocked until backup and registry reconciliation. Dedicated cost-state KV, WAF/static routing, Turnstile widget credentials, and production D1 evidence are pending"
  - name: "Public source activation"
    target: "provider-and-admin-console"
    status: "blocked"
    evidence: "Each source requires rights, attribution, credential owner, region, TTL, health, and audited enable evidence"
  - name: "NAVER Web Maps"
    target: "naver-cloud-console"
    status: "blocked"
    evidence: "2026-07-20 NAVER Cloud owner login is complete and a separate Silsigan Dynamic Map form is prepared with localhost development origins plus Android/iOS identifier kr.silsigan.mobile. Both temporary workers.dev entries were removed from the unsubmitted draft; artifacts/manual-qa/naver-silsigan-draft-complete-20260720.png records the resulting form. Final registration remains unclicked pending explicit approval. A same-day read-only Cloudflare Domains check shows no domain or subdomain. Cloudflare Registrar does not support .kr; exact-name search displayed unpurchased silsigan.app as available at USD 14.20/year with the same displayed renewal price, and no purchase or checkout action was taken. The local release gate now requires representative-account confirmation, monthly/daily hard limits at or below 4,800,000/160,000, an alert threshold at or below 70%, and a confirmed recipient. Domain selection and purchase/addition plus exact staging/production HTTPS origin, masked console limit/recipient evidence, success, and rejection evidence is still required"
  - name: "Ads"
